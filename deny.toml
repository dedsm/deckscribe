# License and dependency policy, checked with `cargo deny check`.
# See docs/licenses.md for what this covers and what it cannot see.

[graph]
all-features = true

[licenses]
# Permissive licenses only: everything here allows closed and open use with
# attribution. Copyleft (GPL, LGPL, AGPL, MPL), source-available (BUSL, SSPL)
# and non-commercial terms are refused by not being listed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
yanked = "deny"
